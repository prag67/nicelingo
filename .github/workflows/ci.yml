name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - name: leak test (no lesson content in public tree)
        run: |
          # Structural tells: Thai/Han script anywhere in code, or a
          # content directory that should only exist post-merge.
          # (docs/ mockups may carry single example words by design.)
          if grep -rnP '[\x{0E00}-\x{0E7F}\x{4E00}-\x{9FFF}]' --include='*.ts' --include='*.mjs' --include='*.js' src scripts tests content public/app; then
            echo 'LEAK: non-Latin script in public code'; exit 1;
          fi
          test ! -e public/static || { echo 'LEAK: public/static present'; exit 1; }
          test ! -e src/lessons/thai.ts || { echo 'LEAK: thai.ts present'; exit 1; }
